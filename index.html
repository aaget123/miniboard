<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miniboard 极简白板</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="toolbar"></div>
      <div id="canvas-wrap">
        <div id="board"></div>
        <div id="welcome-hint" class="welcome-hint" hidden>
          <div class="welcome-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28"><path d="M4.5 19.5l.9-4.1L15.9 4.9a2.1 2.1 0 0 1 3 0l.2.2a2.1 2.1 0 0 1 0 3L8.6 18.6l-4.1.9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M13.5 7.2l3.3 3.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </div>
          <p class="welcome-title">画布空空如也，选择一个工具开始绘制</p>
          <p class="welcome-sub">V 选择 · P 画笔 · T 文本 · Ctrl+K 命令面板</p>
        </div>
        <aside id="ai-panel" hidden>
          <div class="ai-header">
            <div class="ai-mode-tabs">
              <button type="button" data-mode="chat" class="ai-mode-tab active" title="对话、评价建议、把想法画成流程图">交流</button>
              <button type="button" data-mode="edit" class="ai-mode-tab" title="让 AI 按统一功能规则添加/修改绘制工具">编辑</button>
            </div>
            <div class="ai-header-actions">
              <button type="button" id="ai-clear-btn" class="ai-icon-btn" title="清除当前对话（不会删除画布内容）"></button>
              <button type="button" id="ai-close-btn" class="ai-icon-btn" title="关闭 AI 助手">✕</button>
            </div>
          </div>
          <div id="ai-messages"></div>
          <div class="ai-input-bar">
            <button type="button" id="ai-at-btn" class="ai-at-btn" title="@ 选区：让 AI 针对画布上选中的元素优化">@</button>
            <textarea id="ai-input" rows="1" placeholder="输入消息，Enter 发送（Shift+Enter 换行）"></textarea>
            <button type="button" id="ai-send-btn" class="ai-send-btn">发送</button>
          </div>
        </aside>
        <div id="statusbar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
