<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miniboard 极简白板</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="toolbar"></div>
      <div id="canvas-wrap">
        <div id="board"></div>
        <div id="text-editor" hidden>
          <textarea placeholder="点击输入文字…（Ctrl+Enter 确认，Esc 取消）"></textarea>
        </div>
        <aside id="ai-panel" hidden>
          <div class="ai-header">
            <div class="ai-mode-tabs">
              <button type="button" data-mode="chat" class="ai-mode-tab active" title="对话、评价建议、把想法画成流程图">交流</button>
              <button type="button" data-mode="edit" class="ai-mode-tab" title="让 AI 按统一功能规则添加/修改绘制工具">编辑</button>
            </div>
            <div class="ai-header-actions">
              <button type="button" id="ai-settings-btn" class="ai-icon-btn" title="模型设置">⚙</button>
              <button type="button" id="ai-close-btn" class="ai-icon-btn" title="关闭 AI 助手">✕</button>
            </div>
          </div>
          <div id="ai-messages"></div>
          <div class="ai-input-bar">
            <button type="button" id="ai-at-btn" class="ai-at-btn" title="@ 选区：让 AI 针对画布上选中的元素优化">@</button>
            <textarea id="ai-input" rows="1" placeholder="输入消息，Enter 发送（Shift+Enter 换行）"></textarea>
            <button type="button" id="ai-send-btn" class="ai-send-btn">发送</button>
          </div>
        </aside>
        <div id="statusbar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
