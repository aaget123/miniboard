[package]
name = "miniboard"
version = "0.2.0"
description = "Miniboard - 极简离线白板"
authors = ["aaget123"]
license = "MIT"
repository = "https://github.com/aaget123/miniboard"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "miniboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
